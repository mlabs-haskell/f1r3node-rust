[package]
name = "identity-registry"
version = "0.1.0"
edition = "2021"
publish = false

[features]
default = []
integration_tests = []

[dependencies]
models = { path = "../models" }

blake2 = "0.10.6"
clap = { version = "4", features = ["derive", "env"] }
hex = { workspace = true }
node_cli = { git = "https://github.com/F1R3FLY-io/rust-client.git", branch = "main" }
prost = { workspace = true }
rand = { workspace = true }
secp256k1 = { version = "0.31.1", features = ["rand", "serde"] }
thiserror = { workspace = true }
tokio = { workspace = true }
tonic = { workspace = true }
typenum = "1.16.0"
uuid = { version = "1", features = ["v4"] }
